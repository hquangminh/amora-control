<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16151B">
<title>AMORA Control</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#16151B; --surface:#1E1D26; --hi:#282631; --line:#35323F; --soft:#2C2A35;
  --wax:#EDE7DA; --smoke:#918CA0; --dim:#615C6E;
  --ember:#F7A34A; --deep:#8A5220; --glow:rgba(247,163,74,.11);
  --jade:#6FB49B; --rust:#C4574B; --iris:#8C86D6;
  --pad:18px; --r:14px; --nav:74px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100%;background:var(--void);color:var(--wax);
  font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
#app{max-width:620px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;width:100%;background:none;border:none}
select{appearance:none;-webkit-appearance:none}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:5px}
.hidden{display:none!important}
a{color:var(--ember)}

header{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 16px) var(--pad) 12px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:rgba(22,21,27,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--soft)}
.brand{font-family:Lora,serif;font-size:18px;font-weight:600;letter-spacing:.06em}
.brand em{font-style:italic;color:var(--ember);font-weight:500}
.hbar{display:flex;align-items:center;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);color:var(--smoke);transition:.15s}
.iconbtn:hover{color:var(--wax);border-color:var(--dim)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);font-size:11px;letter-spacing:.04em;color:var(--smoke);white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--jade)}
.pill.off{border-color:rgba(196,87,75,.4);color:var(--rust)} .pill.off i{background:var(--rust)}
.pill.demo i{background:var(--dim)}

h1{font-family:Lora,serif;font-size:25px;font-weight:600;line-height:1.2;padding:22px var(--pad) 3px}
.sub{padding:0 var(--pad) 14px;color:var(--smoke);font-size:13px}
.sub b{color:var(--wax);font-weight:600}.sub .warn{color:var(--rust)}
.group{padding:0 var(--pad) 24px}
.glabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--smoke);margin-bottom:9px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.glabel .n{color:var(--ember)}

.seg{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;margin:0 var(--pad) 16px}
.seg button{flex:1;padding:8px 4px;font-size:13px;border-radius:8px;color:var(--smoke);transition:.15s}
.seg button.on{background:var(--hi);color:var(--wax);font-weight:600}

.tools{padding:0 var(--pad) 14px;display:flex;flex-direction:column;gap:9px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px}
.search svg{width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:1.9;flex:0 0 auto}
.search input{font-size:14px}.search input::placeholder{color:var(--dim)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 13px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--smoke);white-space:nowrap;transition:.15s}
.chip:hover{border-color:var(--dim)}
.chip.on{background:var(--glow);border-color:var(--deep);color:var(--ember);font-weight:600}
.chip .c{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;width:100%;text-align:left;display:block;transition:.15s;margin-bottom:10px}
.card:hover{border-color:var(--dim)}
.card:active{transform:scale(.99)}
.card.hot{border-color:var(--deep);background:linear-gradient(var(--glow),transparent 60%),var(--surface)}
.card.bad{border-color:rgba(196,87,75,.32)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--smoke);font-weight:600;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.eyebrow .kw{color:var(--ember)}
.ttl{margin:7px 0 9px;font-size:14.5px;line-height:1.45}
.ttl.serif{font-family:Lora,serif;font-size:15.5px;font-weight:500}
.ttl.muted{color:var(--dim)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--smoke);white-space:nowrap}
.tag.ok{color:var(--jade);border-color:rgba(111,180,155,.34)}
.tag.hot{color:var(--ember);border-color:rgba(247,163,74,.38)}
.tag.bad{color:var(--rust);border-color:rgba(196,87,75,.38)}
.tag.ai{color:var(--iris);border-color:rgba(140,134,214,.34)}
.nums{font-size:12px;color:var(--smoke);font-variant-numeric:tabular-nums}
.nums b{color:var(--wax);font-weight:600}
.errline{font-size:11.5px;color:var(--rust);margin-top:7px;line-height:1.4}

.rail{display:flex;gap:3px;margin:10px 0 8px}
.sg{height:3px;flex:1;border-radius:2px;background:var(--line)}
.sg.on{background:var(--ember)} .sg.bad{background:var(--rust)}
.stages{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.03em;text-transform:uppercase;color:var(--dim)}
.stages span.on{color:var(--wax);font-weight:600}

.item{position:relative;padding-left:38px;padding-bottom:6px}
.item::before{content:'';position:absolute;left:10.5px;top:17px;bottom:-4px;width:1px;background:var(--line)}
.item:last-child::before{display:none}
.item.past::before{background:repeating-linear-gradient(var(--dim) 0 2px,transparent 2px 6px);opacity:.45}
.node{position:absolute;left:0;top:7px;width:22px;height:22px;display:grid;place-items:center}
.node b{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);background:var(--void);display:block}
.item.s-ok .node b{border-color:var(--jade)}
.item.s-hot .node b{background:var(--ember);border-color:var(--ember);box-shadow:0 0 0 4px rgba(247,163,74,.13),0 0 13px rgba(247,163,74,.45)}
.item.s-bad .node b{background:var(--rust);border-color:var(--rust)}

.alert{display:flex;gap:11px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--rust);border-radius:11px;padding:12px 13px;margin-bottom:9px}
.alert.warn{border-left-color:var(--ember)}
.alert .ic{flex:0 0 auto;width:18px;height:18px;margin-top:1px}
.alert .ic svg{width:18px;height:18px;stroke:var(--rust);fill:none;stroke-width:1.9;stroke-linecap:round}
.alert.warn .ic svg{stroke:var(--ember)}
.alert .tx{font-size:13.5px;line-height:1.5}
.alert .hint{font-size:11.5px;color:var(--smoke);margin-top:3px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 var(--pad) 22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.kpi .n{font-family:Lora,serif;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:10.5px;color:var(--smoke);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
.kpi.hot .n{color:var(--ember)}
.kpi.bad .n{color:var(--rust)}

.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--soft)}
.row:last-child{border-bottom:none}
.row .t{font-size:13.5px;line-height:1.4}
.row .d{font-size:11px;color:var(--dim);margin-top:3px}
.bars{display:flex;gap:13px;text-align:right;font-variant-numeric:tabular-nums}
.bars div{font-size:10px;color:var(--smoke);letter-spacing:.04em;text-transform:uppercase}
.bars b{display:block;font-size:15px;font-weight:600;color:var(--wax);text-transform:none;letter-spacing:0}
.bars .hot b{color:var(--ember)}
.bars .bad b{color:var(--rust)}

.run{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--soft)}
.run:last-child{border-bottom:none}
.run .dot{width:7px;height:7px;border-radius:50%;background:var(--jade)}
.run.bad .dot{background:var(--rust)}
.run .wf{font-size:13.5px;font-weight:500}
.run .tm{font-size:11.5px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.run .st{font-size:11.5px;color:var(--smoke);text-align:right;font-variant-numeric:tabular-nums;line-height:1.45}

.field{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;margin-bottom:8px;transition:border-color .15s}
.field:focus-within{border-color:var(--dim)}
.field label{display:block;font-size:11px;color:var(--smoke);margin-bottom:2px;letter-spacing:.04em}
.field input,.field textarea,.field select{font-size:14.5px;padding:0}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field .cnt{font-size:10.5px;color:var(--dim);text-align:right;margin-top:3px;font-variant-numeric:tabular-nums}
.field .cnt.over{color:var(--rust)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.two .field{margin-bottom:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.switch.armed{border-color:var(--rust);background:rgba(196,87,75,.07)}
.switch .hint{font-size:12px;color:var(--smoke);margin-top:3px;line-height:1.45}
.toggle{flex:0 0 auto;width:45px;height:26px;border-radius:99px;background:var(--hi);border:1px solid var(--line);position:relative;transition:.18s}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--smoke);transition:.18s}
.toggle[aria-checked="true"]{background:var(--deep);border-color:var(--ember)}
.toggle[aria-checked="true"]::after{transform:translateX(19px);background:var(--ember)}

.btn{border:1px solid var(--line);border-radius:11px;padding:12px 10px;font-size:14px;font-weight:500;text-align:center;background:var(--hi);transition:.15s;width:100%}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--ember);color:#231404;border-color:var(--ember);font-weight:600}
.btn.primary:hover{background:#FFB264}
.btn.danger{color:var(--rust);border-color:rgba(196,87,75,.33);background:transparent}
.btn.danger:hover{background:rgba(196,87,75,.09)}
.btn.small{padding:9px 8px;font-size:13px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px var(--pad) 18px}
.acts .wide{grid-column:1/-1}
.acts3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.scrim{position:fixed;inset:0;background:rgba(10,9,13,.74);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:620px;margin:0 auto;background:var(--surface);
  border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
  transform:translateY(103%);transition:transform .28s cubic-bezier(.32,.72,0,1);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.sheet.on{transform:translateY(0)}
.grab{width:34px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 2px}
.sheet h2{font-family:Lora,serif;font-size:19px;font-weight:600;padding:12px var(--pad) 2px;line-height:1.3}
.sheet .shsub{padding:0 var(--pad) 15px;font-size:12px;color:var(--smoke)}
.thumb{padding:0 var(--pad) 15px}
.thumb img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.excerpt{padding:0 var(--pad) 16px;font-size:13.5px;color:var(--smoke);line-height:1.6}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);z-index:60;width:min(340px,88vw);
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;opacity:0;pointer-events:none;transition:.18s}
.dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h3{font-family:Lora,serif;font-size:17px;margin-bottom:7px}
.dialog p{font-size:13.5px;color:var(--smoke);line-height:1.5;margin-bottom:17px}
.dialog .r{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.fab{position:fixed;z-index:35;right:max(var(--pad),calc(50vw - 310px + var(--pad)));
  bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);width:52px;height:52px;border-radius:17px;
  background:var(--ember);color:#231404;display:grid;place-items:center;
  box-shadow:0 8px 26px rgba(0,0,0,.5),0 0 0 1px rgba(247,163,74,.3);transition:.15s}
.fab:hover{background:#FFB264;transform:translateY(-1px)}
.fab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:620px;margin:0 auto;
  display:grid;grid-template-columns:repeat(6,1fr);background:rgba(22,21,27,.95);backdrop-filter:blur(16px);
  border-top:1px solid var(--soft);padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:10px 1px 11px;font-size:10px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:500;transition:color .15s;position:relative}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ember)}
nav .badge{position:absolute;top:5px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;
  background:var(--rust);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 var(--pad) 22px}
.ph{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--hi);aspect-ratio:4/5;display:block;width:100%;padding:0}
.ph:hover{border-color:var(--dim)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--dim);text-align:center;padding:10px;line-height:1.5}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 8px 7px;font-size:10px;
  background:linear-gradient(transparent,rgba(10,9,13,.92));display:flex;justify-content:space-between;gap:6px;align-items:flex-end}
.ph .cap b{font-weight:600;color:var(--wax)}
.ph .badge2{position:absolute;top:7px;left:7px;font-size:9.5px;font-weight:700;letter-spacing:.04em;
  padding:3px 7px;border-radius:99px;background:rgba(10,9,13,.75);border:1px solid var(--line);color:var(--smoke)}
.ph .badge2.hot{color:var(--ember);border-color:var(--deep)}
.ph .badge2.ok{color:var(--jade);border-color:rgba(111,180,155,.4)}
.ph .badge2.bad{color:var(--rust);border-color:rgba(196,87,75,.4)}
.empty{padding:44px var(--pad);text-align:center;color:var(--smoke)}
.empty svg{width:32px;height:32px;stroke:var(--dim);fill:none;stroke-width:1.4;margin-bottom:13px}
.empty p{font-size:13.5px;line-height:1.6;margin-bottom:15px}
.empty .btn{display:inline-block;width:auto;padding:11px 22px}
.skel{padding:0 var(--pad)}
.sk{height:84px;border-radius:var(--r);background:linear-gradient(100deg,var(--surface) 30%,var(--hi) 50%,var(--surface) 70%);background-size:240% 100%;animation:sh 1.4s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-140% 0}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 22px);transform:translate(-50%,12px);background:var(--hi);
  border:1px solid var(--line);padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:70;opacity:0;
  pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(196,87,75,.5)}
.banner{margin:0 var(--pad) 15px;padding:11px 13px;border-radius:11px;background:var(--glow);border:1px solid var(--deep);font-size:12.5px;line-height:1.5;word-break:break-word}
.banner b{color:var(--ember)}
.banner.err{background:rgba(196,87,75,.08);border-color:rgba(196,87,75,.45)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">AMORA<em>.</em>control</div>
    <div class="hbar">
      <span class="pill" id="pill"><i></i><span>đang chạy</span></span>
      <button class="iconbtn" id="refresh" aria-label="Tải lại">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
</div>
<button class="fab hidden" id="fab" aria-label="Thêm mới">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="dialog" id="dialog" role="alertdialog"></div>
<div class="toast" id="toast"></div>

<script>
/* ═════════ lưu trữ ═════════ */
const mem={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};

const S={tab:'home', seg:0, filter:'all', q:'',
  apiUrl:store.get('ac.url')||'', apiKey:store.get('ac.key')||'',
  web:[], social:[], seo:[], runs:[], insights:[], settings:{}, pool:[], jobs:[],
  loading:true, open:null, busy:false, conn:'idle', lastErr:''};

/* ═════════ từ vựng ═════════ */
const WEB_FLOW=['IDEA','READY','PROCESSING','WAITING_APPROVAL','APPROVED','PUBLISHED'];
const WEB={IDEA:{l:'Ý tưởng',c:''},READY:{l:'Chờ viết',c:''},PROCESSING:{l:'AI đang viết',c:'ai'},
  WAITING_APPROVAL:{l:'Chờ bạn duyệt',c:'hot'},APPROVED:{l:'Đã duyệt',c:'ok'},
  PUBLISHED:{l:'Đã đăng',c:'ok'},REWRITE:{l:'Cần viết lại',c:'bad'},REJECTED:{l:'Đã huỷ',c:'bad'}};
const SOC={DRAFT:{l:'Chưa có ảnh',c:''},READY:{l:'Sẵn sàng đăng',c:'ok'},PUBLISHING:{l:'Đang đăng',c:'ok'},
  LIVE:{l:'Đã đăng',c:'hot'},PARTIAL:{l:'Thiếu kênh',c:'bad'},FAILED:{l:'Lỗi',c:'bad'},DEAD:{l:'Cần xử lý',c:'bad'}};
const SEOACT={
  KEEP:{l:'Giữ nguyên',c:'ok',d:'Đang top, AI không được đụng'},
  WATCH:{l:'Theo dõi',c:'',d:'Bài mới hoặc thiếu dữ liệu'},
  NO_GSC_DATA:{l:'GSC không thấy URL',c:'bad',d:'published_url có thể sai — sửa tay'},
  HUMAN_REVIEW:{l:'Cần bạn xem',c:'bad',d:'Đã tự sửa 2 lần không lên'},
  CTR_FIX:{l:'Sửa tiêu đề + meta',c:'hot',d:'Top 10 nhưng ít người bấm'},

async function api(action,payload={}){
  if(!S.apiUrl){await new Promise(r=>setTimeout(r,160));const d=demo();
    return {web_list:{web:d.web},social_list:{social:d.social},seo_list:{seo:d.seo},
      runs:{runs:d.runs},insights:{insights:d.insights},settings:{settings:d.settings},pool_list:{pool:d.pool},studio_list:{jobs:d.jobs}}[action]||{ok:true,demo:true}}
  let r;
  try{
    r=await fetch(S.apiUrl,{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.apiKey},
      body:JSON.stringify({action,...payload})});
  }catch(e){
    throw new Error(S.apiUrl.includes('/webhook-test/')
      ? 'Đang dùng URL thử nghiệm. Đổi /webhook-test/ thành /webhook/ rồi Activate workflow.'
      : 'Không gọi được n8n. Kiểm tra: workflow đã Activate chưa, URL có đúng https không, node Webhook đã đặt allowedOrigins chưa.');
  }
  if(r.status===404) throw new Error('n8n không tìm thấy webhook này. Workflow chưa Activate, hoặc sai đường dẫn cuối URL.');
  if(r.status===401||r.status===403) throw new Error('Sai khoá truy cập. Chuỗi trong app phải khớp credential Header Auth x-api-key ở n8n.');
  if(r.status>=500) throw new Error('n8n nhận được lệnh nhưng workflow chạy lỗi. Mở tab Executions trong n8n xem node nào đỏ.');
  if(!r.ok) throw new Error('n8n trả về '+r.status);
  let j;
  try{ j=await r.json(); }catch(e){ throw new Error('n8n trả về dữ liệu không phải JSON. Node Respond có thể chưa đặt Respond With = JSON.'); }
  if(j.error)throw new Error(j.error);
  return j;
}

function alerts(){
  const a=[];
  const stuck=S.web.filter(w=>w.status==='PROCESSING'&&pv(w.updated_at)&&(Date.now()-pv(w.updated_at))>30*60000);
  if(stuck.length)a.push({lv:'bad',t:`${stuck.length} bài website kẹt ở "AI đang viết" quá 30 phút`,
    h:'AMORA 2 nhiều khả năng chết giữa chừng. Bấm Gỡ kẹt để đưa về hàng đợi.',act:'unstick'});
  const fails=S.runs.filter(r=>String(r.status).toUpperCase()!=='OK');
  if(fails.length)a.push({lv:'bad',t:`${fails.length} lượt chạy thất bại gần đây`,
    h:fails.map(f=>f.workflow).join(', '),act:'runs'});

function show(){
  document.getElementById('scrim').classList.add('on');
  const s=document.getElementById('sheet'); s.classList.add('on'); s.scrollTop=0;
  const ta=document.getElementById('e_caption');
  if(ta){const c=document.getElementById('cnt');
    const u=()=>{c.textContent=`${ta.value.length} / 2200`;c.className='cnt'+(ta.value.length>2200?' over':'')};
    ta.oninput=u;u()}
}
function hide(){document.getElementById('sheet').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');S.open=null}
function ask(title,msg,ok,fn){
  const d=document.getElementById('dialog');
  d.innerHTML=`<h3>${title}</h3><p>${msg}</p><div class="r">
    <button class="btn" data-dlg="no">Huỷ</button><button class="btn danger" data-dlg="yes">${ok}</button></div>`;
  d.classList.add('on');document.getElementById('scrim').classList.add('on');
  d.onclick=e=>{const b=e.target.closest('[data-dlg]');if(!b)return;d.classList.remove('on');
    if(!S.open)document.getElementById('scrim').classList.remove('on');
    if(b.dataset.dlg==='yes')fn()};
}

/* ═════════ hành động ═════════ */
const F={web:['focus_keyword','title','slug','publish_at'],
  social:['caption','hashtags','publish_at','channel','pillar','source','ai_prompt']};
const rf=k=>{const o={};for(const x of (F[k]||[])){const el=document.getElementById('e_'+x);if(el)o[x]=el.value}return o};

async function act(op){
  if(!S.open||S.busy)return;
  if(op==='close')return hide();
  const {kind,key,isNew}=S.open;

  if(op==='delete')return ask('Xoá bài này?',
    'Bài sẽ biến khỏi danh sách. Dòng vẫn nằm trong Google Sheet với trạng thái đã xoá.',
    'Xoá',()=>send('social_write',{op:'delete',patch:{post_key:key}},'Đã xoá'));

  if(['approve','rewrite','reject'].includes(op)){
    const L={approve:['Duyệt đăng bài này?','AMORA 2 sẽ đăng lên WordPress ngay.','Duyệt'],
      rewrite:['Yêu cầu viết lại?','Bài quay về trạng thái REWRITE, bạn chỉnh chủ đề rồi cho chạy lại.','Viết lại'],
      reject:['Huỷ bài này?','Bài bị đánh REJECTED và không đăng nữa.','Huỷ bài']}[op];
    return ask(L[0],L[1],L[2],()=>send('approve',{content_id:key,decision:op},
      {approve:'Đã duyệt, AMORA 2 đang đăng',rewrite:'Đã yêu cầu viết lại',reject:'Đã huỷ bài'}[op]));
  }

  if(kind==='job'){
    const g=i=>document.getElementById('e_'+i)?.value;
    return send('studio_create',{patch:{source_asset_key:g('source_asset_key'),mode:g('mode'),
      scene_brief:g('scene_brief'),pillar:g('pillar'),variants:g('variants')}},'Đã đặt lô, WF5 sẽ tạo');
  }
  if(kind==='pool'){
    const patch={asset_key:key};
    if(op==='save'){patch.pillar=document.getElementById('e_pillar')?.value;
      patch.alt_text=document.getElementById('e_alt_text')?.value}
    const M={approve:'Đã đưa vào kho',reject:'Đã loại',retire:'Đã cho nghỉ',save:'Đã lưu'};
    return send('pool_write',{op,patch},M[op]||'Xong');
  }
  if(kind==='web'){
    const patch={content_id:key,...(op==='save'?rf('web'):{})};
    const M={save:'Đã lưu',unstick:'Đã đưa về hàng đợi',requeue:'Đã đưa lại vào hàng đợi viết'};
    return send('web_write',{op,patch},M[op]||'Xong');
  }
  if(kind==='seo'){
    const M={run_refresh:'Đã đặt hàng, AMORA 3 sẽ chỉnh ở lượt tới',mark_keep:'Đã đánh dấu giữ nguyên'};
    return send('web_write',{op,patch:{content_id:key}},M[op]||'Xong');
  }
  if(isNew){
    const patch={post_key:key,...rf('social'),status:'DRAFT',retry_count:0};
    return send('social_create',{patch},'Đã thêm vào hàng đợi');
  }
  if(op==='duplicate'){
    const src=S.social.find(x=>x.post_key===key); if(!src)return;
    const c={...src,post_key:nk('AM'),status:'DRAFT',cdn_url:'',last_error:'',retry_count:0,publish_at:''};
    return send('social_create',{patch:c},'Đã nhân bản');
  }
  const patch={post_key:key,...(op==='save'?rf('social'):{})};
  const M={save:'Đã lưu',publish_now:'Đã đẩy lên đầu hàng đợi',regen:'Sẽ lấy ảnh mới ở lượt chạy tới',retry:'Đã đặt lại, sẽ thử lại'};
  return send('social_write',{op,patch},M[op]||'Xong');
}

async function send(action,payload,msg){
  S.busy=true;
  document.querySelectorAll('.sheet .btn').forEach(b=>b.disabled=true);
  try{await api(action,payload);toast(msg);hide();await load(true)}
  catch(e){toast(e.message,true);document.querySelectorAll('.sheet .btn').forEach(b=>b.disabled=false)}
  S.busy=false;
}

/* ═════════ khung ═════════ */
function render(){
  document.getElementById('main').innerHTML=
    S.tab==='home'?vHome():S.tab==='web'?vWeb():S.tab==='social'?vSocial():
    S.tab==='seo'?vSeo():S.tab==='pool'?vPool():vSys();
  const pend=S.web.filter(w=>w.status==='WAITING_APPROVAL').length;
  document.getElementById('nav').innerHTML=TABS.map(t=>
    `<button data-tab="${t.k}" class="${S.tab===t.k?'on':''}">
      <svg viewBox="0 0 24 24"><path d="${t.d}"/></svg>${t.t}
      ${t.k==='home'&&pend?`<span class="badge">${pend}</span>`:''}</button>`).join('');
  document.getElementById('fab').classList.toggle('hidden',!['social','pool'].includes(S.tab));
  const pill=document.getElementById('pill');
  if(!S.apiUrl){pill.className='pill demo';pill.querySelector('span').textContent='bản xem thử'}
  else if(S.conn==='fail'){pill.className='pill off';pill.querySelector('span').textContent='không nối được'}
  else if(S.conn!=='ok'){pill.className='pill demo';pill.querySelector('span').textContent='đang thử nối'}
  else{const off=String(S.settings.KILL_SWITCH||'OFF').toUpperCase()==='ON';
    pill.className='pill'+(off?' off':'');
    pill.querySelector('span').textContent=off?'đã tạm dừng':'đang chạy'}
  bind();
}

function bind(){
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{
    const i=el.dataset.open.indexOf(':');
    const k=el.dataset.open.slice(0,i),id=el.dataset.open.slice(i+1);
    k==='web'?shWeb(id):k==='social'?shSocial(id):k==='pool'?shPool(id):shSeo(id)});
  document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{S.filter=el.dataset.filter;render()});
  document.querySelectorAll('[data-seg]').forEach(el=>el.onclick=()=>{S.seg=+el.dataset.seg;render()});
  document.querySelectorAll('[data-newjob]').forEach(el=>el.onclick=()=>shJob());
  document.querySelectorAll('[data-new]').forEach(el=>el.onclick=()=>{
    if(el.dataset.new==='social')shSocial(); else {S.tab='web';render()}});
  document.querySelectorAll('[data-run]').forEach(el=>el.onclick=async()=>{
    el.disabled=true;
    try{await api('trigger',{hook:el.dataset.run});toast('Đã gửi lệnh chạy');setTimeout(()=>load(true),3000)}
    catch(e){toast(e.message,true)}
    el.disabled=false});
  document.querySelectorAll('[data-act2]').forEach(el=>el.onclick=()=>{
    ask('Gỡ tất cả bài kẹt?','Mọi bài ở trạng thái PROCESSING quá 30 phút sẽ được đưa về READY để AMORA 2 nhặt lại.',
      'Gỡ kẹt',async()=>{try{await api('web_write',{op:'unstick_all',patch:{}});toast('Đã gỡ');await load(true)}
        catch(e){toast(e.message,true)}})});

  const q=document.getElementById('q');
  if(q)q.oninput=()=>{S.q=q.value;clearTimeout(q._t);
    q._t=setTimeout(()=>{const p=q.selectionStart;render();
      const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(p,p)}},280)};

  const conn=document.getElementById('b_conn');
  if(conn)conn.onclick=async()=>{
    S.apiUrl=document.getElementById('f_url').value.trim();
    S.apiKey=document.getElementById('f_key').value.trim();
    store.set('ac.url',S.apiUrl);store.set('ac.key',S.apiKey);
    toast(S.apiUrl?'Đang kết nối…':'Đã quay về dữ liệu mẫu');await load()};
  const fix=document.getElementById('b_fix');
  if(fix)fix.onclick=async()=>{
    S.apiUrl=S.apiUrl.replace('/webhook-test/','/webhook/');
    store.set('ac.url',S.apiUrl); toast('Đã đổi sang URL chính thức'); await load()};

  const diag=document.getElementById('b_diag');
  if(diag)diag.onclick=async()=>{
    if(!S.apiUrl)return toast('Chưa nhập địa chỉ webhook',true);
    if(S.apiUrl.includes('/webhook-test/'))return toast('Đang dùng URL thử nghiệm — bấm nút đổi ở trên',true);
    diag.disabled=true; diag.textContent='Đang kiểm tra…';
    try{
      const r=await api('settings');
      const n=Object.keys(r.settings||{}).length;
      S.conn='ok'; S.lastErr='';
      toast(n?`Nối tốt — đọc được ${n} dòng cấu hình`:'Nối được nhưng RESEARCH_SETTINGS trống');
    }catch(e){ S.conn='fail'; S.lastErr=e.message; toast(e.message,true); }
    diag.disabled=false; render();
  };

  const kill=document.getElementById('t_kill');
  if(kill)kill.onclick=async()=>{
    const next=kill.getAttribute('aria-checked')==='true'?'OFF':'ON';
    try{await api('settings_save',{settings:{KILL_SWITCH:next}});S.settings.KILL_SWITCH=next;
      toast(next==='ON'?'Đã tạm dừng toàn hệ':'Đã chạy lại');render()}
    catch(e){toast(e.message,true)}};
  const cfg=document.getElementById('b_cfg');
  if(cfg)cfg.onclick=async()=>{
    const out={};
    ['PUBLISH_DAYS','PUBLISH_HOUR','PUBLISH_MINUTE','POSTS_PER_DAY','ARTICLE_MIN_WORDS','AUDIT_PASS_SCORE',
     'BRAND_TONE','GSC_LOOKBACK_DAYS','MAX_REFRESH_ATTEMPT','REFRESH_ENABLED',
     'SOCIAL_SLOT_1','SOCIAL_SLOT_2','SOCIAL_SLOT_3','SOCIAL_PREP_AHEAD_HOURS','SOCIAL_MAX_RETRY']
      .forEach(k=>{const v=document.getElementById('c_'+k)?.value;if(v!==undefined)out[k]=v});
    try{await api('settings_save',{settings:out});Object.assign(S.settings,out);toast('Đã lưu cài đặt')}
    catch(e){toast(e.message,true)}};
}

document.getElementById('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;
  S.tab=b.dataset.tab;S.filter='all';S.q='';S.seg=0;render()};
document.getElementById('fab').onclick=()=>S.tab==='pool'?shJob():shSocial();
document.getElementById('scrim').onclick=()=>{document.getElementById('dialog').classList.remove('on');hide()};
document.getElementById('sheet').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(a)act(a.dataset.act)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){
  document.getElementById('dialog').classList.remove('on');if(S.open)hide()}});
document.getElementById('refresh').onclick=()=>load();

async function load(quiet){
  const rb=document.getElementById('refresh'); rb.classList.add('spin');
  if(!quiet){S.loading=true;render()}
  try{
    const [a,b,c,d,e,f,g,h]=await Promise.all([
      api('web_list'),api('social_list'),api('seo_list'),api('runs'),api('insights'),api('settings'),
      api('pool_list'),api('studio_list')]);
    S.web=a.web||[]; S.social=b.social||[]; S.seo=c.seo||[];
    S.runs=d.runs||[]; S.insights=e.insights||[]; S.settings=f.settings||{};
    S.pool=g.pool||[]; S.jobs=h.jobs||[];
    S.conn='ok'; S.lastErr='';
    store.set('ac.cache',JSON.stringify({web:S.web,social:S.social,seo:S.seo,
      runs:S.runs,insights:S.insights,settings:S.settings,pool:S.pool,jobs:S.jobs}));
  }catch(err){
    S.conn='fail'; S.lastErr=err.message;
    const c=store.get('ac.cache');
    if(c){const d=JSON.parse(c);['web','social','seo','runs','insights','settings','pool','jobs']
      .forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
      toast('Không nối được — đang hiện bản lưu gần nhất',true)}
    else toast(err.message,true);
  }
  S.loading=false; rb.classList.remove('spin'); render();
}

if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render(); load();
</script>
</body>
</html>
